plugins {
    id 'java'
    id 'war'
    id 'org.gretty' version '5.0.2'
}

group 'dmit2015'
version '1.0-SNAPSHOT'


repositories {
    mavenCentral()
}

ext {
    junitVersion = '6.1.3'
}

compileJava {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // compileOnly('jakarta.platform:jakarta.jakartaee-web-api:11.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter-api:${junitVersion}'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:${junitVersion}'

    // CDI implementation (Weld) for Apache Tomcat 11
    implementation 'org.jboss.weld.servlet:weld-servlet-shaded:6.0.4.Final' 
    // Microprofile Config (Smallrye) implementation for Apache Tomcat 11
    implementation 'io.smallrye.config:smallrye-config:3.18.2'
    // Jakarta Faces (Mojarra) implementation for Apache Tomcat 11
    implementation 'org.glassfish:jakarta.faces:4.1.14'
    // Jakarta Validation (Hibernate) implementation for Apache Tomcat 11
    implementation 'org.hibernate.validator:hibernate-validator:9.1.3.Final'
    // Jakarta JSON Binding (Yasson) implementation for Apache Tomcat 11
    implementation 'org.eclipse:yasson:3.0.5'
    // DataFaker is for creating fake data using a provider
    implementation 'net.datafaker:datafaker:2.7.0'

    runtimeOnly 'org.webjars.npm:primeflex:4.0.0'
    implementation 'org.primefaces:primefaces:16.0.0'
    implementation 'org.omnifaces:omnifaces:5.5'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20260313.1'
}

gretty {
    servletContainer = 'tomcat11'
    contextPath = '/'
    httpPort = 8080
}


test {
    useJUnitPlatform()
}
